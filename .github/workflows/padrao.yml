# Mesma validacao que ferramentas/validar.sh roda localmente. Se divergir, o script
# e a fonte da verdade — a CI so o executa.
name: manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  padrao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar PyYAML
        run: pip install --quiet pyyaml

      - name: instalar trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: validar
        # Sem isto, trivy que falhe ao instalar deixaria a validacao passar
        # verde com quatro regras do padrao sem conferencia nenhuma.
        env:
          TRIVY_OBRIGATORIO: "1"
        run: bash ferramentas/validar.sh
