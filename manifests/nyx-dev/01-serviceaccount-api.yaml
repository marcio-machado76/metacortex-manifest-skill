# Regra 3.5: cada workload com a sua conta, nunca a `default` do namespace.
# Nenhum RBAC esta associado a esta — o kube-news nao consulta o apiserver, e
# conta sem permissao e o unico jeito de garantir que continue assim.
#
# Regra 3.4: `automountServiceAccountToken` aceita ser declarado tanto no pod
# quanto aqui. Os dois pontos estao preenchidos de proposito: o do pod e o que o
# padrao cobra, e o daqui vale como piso para qualquer workload futuro que passe
# a usar esta conta sem repetir a declaracao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: squad-nyx
automountServiceAccountToken: false
