# Regra 3.5 — uma ServiceAccount por workload. O banco tampouco fala com o
# apiserver, entao nenhum RBAC esta ligado a ela.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-postgres
  namespace: nyx-stg
  labels:
    app.kubernetes.io/name: nyx-postgres
    app.kubernetes.io/instance: nyx-stg
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: squad-nyx
automountServiceAccountToken: false
